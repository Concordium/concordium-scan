name: Check backend

on:
  push:
    branches: main
    paths:
        - backend/**
        - .github/**
  pull_request:
    paths:
        - backend/**
        - .github/**
  workflow_dispatch: # allows manual trigger

jobs:
  rustfmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check formatting
        working-directory: backend
        run: |
          rustup component add rustfmt
          cargo fmt -- --color=always --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        run: |
          rustup component add clippy
      - name: Run clippy
        working-directory: backend
        run: |
          cargo clippy --locked --color=always --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run unit tests
        working-directory: backend
        run: |
          cargo test --all-features --locked

  schema-diff:
    name: GraphQL schema diff
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install diff tool
        run: npm install --prefix "$RUNNER_TEMP/graphql-inspector" @graphql-inspector/ci@5.0.7 graphql@16.11.0
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build ccdscan-api and output schema
        working-directory: backend
        run: |
          cargo run --bin ccdscan-api -- --schema-out $RUNNER_TEMP/schema.graphql
      - name: Compare schemas
        working-directory: backend
        run: $RUNNER_TEMP/graphql-inspector/node_modules/.bin/graphql-inspector diff schema.graphql $RUNNER_TEMP/schema.graphql
