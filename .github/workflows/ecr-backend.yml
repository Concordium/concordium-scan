name: Backend image to ECR

# On pushes to main or release/p11, build the indexer and api images and push them
# to ECR in the concordium-builds account, tagged with the commit SHA. Release
# images still go to Docker Hub via release-backend.yml on tags.
on:
  push:
    branches:
      - main
      - release/p11
    paths:
      - backend/**
      - .github/workflows/ecr-backend.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::053828498583:role/github-actions-ecr-push-ccdscan
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build indexer docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: ${{ steps.login-ecr.outputs.registry }}/ccdscan-indexer:${{ github.sha }}
          push: true
          build-args: |
            target_binary=ccdscan-indexer

      - name: Build api docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          tags: ${{ steps.login-ecr.outputs.registry }}/ccdscan-api:${{ github.sha }}
          push: true
          build-args: |
            target_binary=ccdscan-api
