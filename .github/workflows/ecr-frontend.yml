name: Frontend image to ECR

# On pushes to main or release/p11, build the frontend image and push it to ECR in
# the concordium-builds account, tagged with the commit SHA. Release images still
# go to Docker Hub via frontend-release.yml on tags.
on:
  push:
    branches:
      - main
      - release/p11
    paths:
      - frontend/**
      - .github/workflows/ecr-frontend.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::053828498583:role/github-actions-ecr-push-ccdscan
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/ccdscan-frontend:${{ github.sha }}
